services:
  - type: worker
    name: komara-video-agent
    env: python
    buildCommand: pip install -r agent_requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN_2
        sync: false
      - key: HUGGING_FACE_ACCESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
